dds:
  domain_id: 0
  interface: "lo"
  topic: "rt/front_depth_observation"

camera:
  serial: ""
  frame_id: "d435i_depth_optical_frame"
  width: 640
  height: 360
  capture_fps: 30
  publish_hz: 15
  warmup_frames: 30
  wait_timeout_ms: 2000
  emitter_enabled: true
  near_clip: 0.16
  far_clip: 2.0

validation:
  expected_horizontal_fov: 89.0
  expected_vertical_fov: 58.0
  fov_tolerance: 3.0
  principal_point_tolerance_px: 8.0
